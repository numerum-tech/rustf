name: Release

# Builds prebuilt rustf-cli binaries for each tagged release and attaches them
# to the GitHub Release. Paired with `[package.metadata.binstall]` in
# rustf-cli/Cargo.toml so `cargo binstall rustf-cli` downloads these instead of
# compiling from source.
#
# Tag a release like `v1.0.0-rc1` to trigger it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  upload-binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Builds rustf-cli for the target (using `cross` automatically for
      # non-native targets), archives it as
      # `rustf-cli-<tag>-<target>.{tar.gz|zip}`, and uploads to the Release.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: rustf-cli
          manifest-path: rustf-cli/Cargo.toml
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}
