name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No workspace manifest — each crate is built independently, in
        # dependency order.
        crate: [rustf-macros, rustf-schema, rustf, rustf-cli]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Build (warnings denied)
        working-directory: ${{ matrix.crate }}
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --all-features --verbose

      - name: Test
        working-directory: ${{ matrix.crate }}
        # Redis-backed session tests probe 127.0.0.1:6379 and skip themselves
        # when no server answers, so no service container is needed here. To
        # actually exercise them, add a `redis` service to this job and set
        # RUSTF_TEST_REDIS=1, which turns an unreachable server into a failure.
        run: cargo test --all-features --no-fail-fast --verbose
