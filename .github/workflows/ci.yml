name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No workspace manifest — each crate is built independently, in
        # dependency order.
        crate: [rustf-macros, rustf-schema, rustf, rustf-cli]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Build (warnings denied)
        working-directory: ${{ matrix.crate }}
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --all-features --verbose

      - name: Test
        working-directory: ${{ matrix.crate }}
        # redis-server integration tests are #[ignore]'d (no service needed).
        run: cargo test --all-features --no-fail-fast --verbose
