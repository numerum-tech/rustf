[package]
name = "rustf-macros"
version = "1.0.0-rc2"
edition = "2021"
description = "Procedural macros for RustF framework - auto-discovery of controllers and models"
license = "MIT OR Apache-2.0"
repository = "https://github.com/numerum-tech/rustf"
keywords = ["rustf", "macros", "proc-macro", "auto-discovery", "mvc"]
categories = ["web-programming", "development-tools::procedural-macro-helpers"]
readme = "README.md"
documentation = "https://docs.rs/rustf-macros"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
walkdir = "2.4"

[features]
default = []
embedded-views = []

[dev-dependencies]
tempfile = "3.8"
