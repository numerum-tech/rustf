[package]
name = "sample-app"
version = "0.1.0"
edition = "2021"
description = "A RustF task management sample application"
authors = ["Numerum Tech"]

[dependencies]
rustf = { path = "../rustf" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
uuid = { version = "1.0", features = ["v4", "serde"] }
