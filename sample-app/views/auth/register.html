<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <h1 class="h3 fw-bold mb-3">@{M.title}</h1>
                <p class="text-secondary">Create an account to try the full RustF task workflow.</p>
                <form method="POST" action="/register" class="mt-4">
                    @{csrf}
                    <div class="mb-3">
                        <label class="form-label" for="display_name">Display name</label>
                        <input class="form-control" id="display_name" name="display_name" type="text" autocomplete="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="password_confirm">Confirm password</label>
                            <input class="form-control" id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required>
                        </div>
                    </div>
                    <button class="btn btn-warning w-100 mt-4" type="submit">Create Account</button>
                </form>
                <p class="text-secondary small mt-4 mb-0">Already registered? <a href="/login">Sign in instead</a>.</p>
            </div>
        </div>
    </div>
</div>
