<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <h1 class="h3 fw-bold mb-3">@{M.title}</h1>
                <p class="text-secondary">Sign in to manage your task lists and update tasks inline.</p>
                <form method="POST" action="/login" class="mt-4">
                    @{csrf}
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-dark w-100" type="submit">Sign In</button>
                </form>
                <p class="text-secondary small mt-4 mb-0">No account yet? <a href="/register">Create one</a>.</p>
            </div>
        </div>
    </div>
</div>
