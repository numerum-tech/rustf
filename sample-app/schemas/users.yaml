# Users who can authenticate into the task application
Users:
  table: users
  database_type: sqlite
  element_type: table
  version: 1
  ai_context: "Application users who register, log in, and own task lists."

  fields:
    id:
      type: int
      lang_type: i32
      required: true
      primary_key: true
      auto: true
      ai: "Primary key for the user record."

    email:
      type: string(150)
      lang_type: String
      required: true
      unique: true
      ai: "Unique login identifier for the user."

    display_name:
      type: string(120)
      lang_type: String
      required: true
      ai: "Name shown across the UI."

    password_hash:
      type: string(255)
      lang_type: String
      required: true
      ai: "Bcrypt hash of the user's password."

    created_at:
      type: int
      lang_type: i64
      required: true
      ai: "Unix timestamp when the user account was created."

  indexes:
    - name: idx_users_email
      fields: [email]
      ai: "Unique lookup for login."
