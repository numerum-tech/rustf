[package]
name = "rustf"
version = "1.0.0-rc1"
edition = "2021"
description = "A simple MVC web framework inspired by Total.js"
license = "MIT OR Apache-2.0"
repository = "https://github.com/numerum-tech/rustf"
keywords = ["web", "framework", "mvc", "totaljs"]
categories = ["web-programming::http-server"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper = { version = "0.14", features = ["full"] }
url = "2.0"
regex = "1.0"
log = "0.4"
once_cell = "1.0"
thiserror = "2.0"
dashmap = "6.0"
num_cpus = "1.16"
indexmap = "2.0"
lazy_static = "1.4"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
percent-encoding = "2.3"
urlencoding = "2.1"
async-trait = "0.1"
anyhow = "1.0"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.32", features = ["serde"], optional = true }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "json",
    "chrono",
    "uuid",
    "ipnetwork",
], optional = true }
ipnetwork = "0.20"
toml = "0.9"
serde-toml-merge = "0.3"
rust-embed = { version = "8.0", optional = true }
rustf-macros = { version = "1.0.0-rc1", path = "../rustf-macros" }
rustf-schema = { version = "1.0.0-rc1", path = "../rustf-schema", optional = true }
redis = { version = "0.27", features = ["tokio-comp"], optional = true }
deadpool-redis = { version = "0.18", optional = true }
clap = { version = "4.4", features = ["derive"], optional = true }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
flate2 = "1.0"

# Fast JSON parsing (2-3x faster than serde_json)
# Note: simd-json is primarily for parsing, not serialization
simd-json = { version = "0.13", features = ["serde", "alloc"] }

[features]
default = [
    "embedded-views",
    "auto-discovery",
    "schema",
    "decimal",
    "uuid",
    "redis",
    "db-postgres",
    "db-mysql",
    "db-sqlite",
]
# TOML config loading is core to the framework and always compiled. This
# feature is kept as a no-op for backward compatibility with consumers that
# still list `features = ["config"]`; it can no longer be disabled.
config = []
# SQL database support. `database` pulls in the driverless sqlx core; each
# `db-*` feature turns on one sqlx driver. All three are on by default
# (opt-out): use --no-default-features to drop them, then enable only the
# driver(s) you need (e.g. "db-postgres").
database = ["dep:sqlx"]
db-postgres = ["database", "sqlx/postgres"]
db-mysql = ["database", "sqlx/mysql"]
db-sqlite = ["database", "sqlx/sqlite"]
# Redis-backed session storage (the only built-in cross-instance/cluster store).
# On by default; disable with --no-default-features to drop the redis deps, then
# supply a custom SessionStorage implementation for shared sessions.
redis = ["dep:redis", "dep:deadpool-redis"]
embedded-views = ["rust-embed", "rustf-macros/embedded-views"]
auto-discovery = []
schema = ["rustf-schema"]
decimal = ["rust_decimal", "sqlx?/rust_decimal"]
uuid = []
cli = ["clap"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
criterion = "0.5"

[[bench]]
name = "configuration"
harness = false

[[bench]]
name = "context"
harness = false

[[bench]]
name = "middleware"
harness = false

[[bench]]
name = "pool"
harness = false

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "session"
harness = false

[[bench]]
name = "minifier"
harness = false

[[bench]]
name = "compression"
harness = false

[[bench]]
name = "view_render"
harness = false

[[bench]]
name = "http_date"
harness = false

[[bench]]
name = "request_lifecycle"
harness = false
